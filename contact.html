<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Jean Doroszczuk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200;300;400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Oxanium', sans-serif;
      background-color: #000000;
      color: #f2f2f2;
      letter-spacing: 0.02em;
      line-height: 1.5;
      overflow-x: hidden;
    }

    a, div { color: inherit; text-decoration: none; }

    .overlay-sortie {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 1000;
      opacity: 0;
      transition: opacity 2.4s ease;
      pointer-events: none;
    }

    .conteneur {
      display: grid;
      grid-template-columns: 40% 1fr;
      min-height: 100vh;
    }

    .gauche {
      padding: 50px 40px 50px 60px;
      border-right: 1px solid #222;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    header h1 {
      font-size: 30px;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.15;
      cursor: pointer;
    }

    .fonction {
      color: #888;
      font-size: 10px;
      margin-top: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .menu-principal { margin-top: 45px; display: flex; flex-direction: column; gap: 10px; }

    .menu-principal a, .menu-principal div {
      font-size: 11px;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
    }

    .menu-principal a:hover, .menu-principal div:hover { color: #fff; }

    .liens-pages {
      margin-top: 60px;
      padding-top: 20px;
      border-top: 1px solid #222;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .liens-pages a, .liens-pages div {
      font-size: 11px;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
    }

    .liens-pages a.active { color: #fff; }
    .liens-pages a:hover, .liens-pages div:hover { color: #fff; }

    .droite {
      padding: 50px 60px 50px 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 30px;
      opacity: 0;
      animation: fadeInContent 2.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes fadeInContent {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .lien-contact {
      font-size: 14px;
      font-weight: 300;
      color: #fff;
      border-bottom: 1px solid #fff;
      padding: 18px 0;
      transition: color 0.25s;
    }

    .lien-contact:hover { color: #888; }

    @media (max-width: 900px) {
      .conteneur { grid-template-columns: 1fr; }
      .gauche {
        padding: 30px 24px;
        border-right: none;
        border-bottom: 1px solid #222;
        height: auto;
        position: relative;
      }
      .droite {
        padding: 40px 24px;
        animation: none;
        opacity: 1;
      }
      .overlay-sortie { display: none; }
    }
  </style>
</head>
<body>
  <div class="overlay-sortie" id="overlaySortie"></div>

  <div class="conteneur">
    <div class="gauche">
      <header>
        <div id="retourIndex" class="retour-element"><h1>Jean<br>Doroszczuk</h1></div>
        <p class="fonction">Chef Opérateur / Vidéaste</p>
      </header>

      <nav class="menu-principal">
        <div class="retour-element">Retour</div>
      </nav>

      <div class="liens-pages">
        <a href="bio.html">Bio</a>
        <div class="active">Contact</div>
      </div>
    </div>

    <div class="droite">
      <a class="lien-contact" href="mailto:jean.doroszczuk@pm.me">jean.doroszczuk@pm.me</a>
      <a class="lien-contact" href="https://www.instagram.com/jeandoroszczuk/" target="_blank">Instagram — @jeandoroszczuk</a>
    </div>
  </div>

  <script>
    // Script EXÉCUTÉ IMMÉDIATEMENT (IIFE)
    (function() {
      const elements = document.querySelectorAll('.retour-element');
      
      elements.forEach(el => {
        el.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          
          const overlay = document.getElementById('overlaySortie');
          overlay.style.opacity = '1';
          
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 2400);
        });
      });
    })();
  </script>
</body>
</html>
